<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AR Learn{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script>
    document.addEventListener("htmx:configRequest", (e) => {
      e.detail.headers["X-CSRFToken"] = "{{ csrf_token }}";
    });
  </script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

  <!-- Navbar -->
  <nav class="border-b border-gray-800 px-6 py-3 flex items-center justify-between">
    <a href="/" class="text-xl font-bold text-blue-400">AR Learn</a>
    <div class="flex items-center gap-4 text-sm">
      {% if user.is_authenticated %}
        <a href="/ar/" class="text-gray-300 hover:text-white">AR View</a>
        <a href="/api/history/" class="text-gray-300 hover:text-white">History</a>
        <a href="/accounts/profile/" class="text-gray-300 hover:text-white">Profile</a>
        <a href="/accounts/logout/" class="text-red-400 hover:text-red-300">Logout</a>
      {% else %}
        <a href="/accounts/login/" class="bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded-lg">Sign in</a>
      {% endif %}
    </div>
  </nav>

  <!-- Flash messages -->
  {% if messages %}
  <div class="max-w-2xl mx-auto mt-4 px-4 space-y-2">
    {% for message in messages %}
    <div class="px-4 py-3 rounded-lg text-sm
      {% if message.tags == 'success' %}bg-green-900 text-green-300 border border-green-700
      {% elif message.tags == 'error' %}bg-red-900 text-red-300 border border-red-700
      {% else %}bg-gray-800 text-gray-300 border border-gray-700{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
